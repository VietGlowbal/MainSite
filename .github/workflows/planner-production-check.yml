name: Planner Production Check

on:
  pull_request:
  push:
    branches:
      - codex/planner-main-publish
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planner-production-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planner-tests:
    name: Planner Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Planner tests
        run: >-
          npm exec vitest run
          src/features/ai-strategy-dashboard
          'src/app/ai-strategy/[applicationId]/planner'
          'src/app/api/admin/applications/[id]/planner/sync/route.test.ts'

  planner-db-integration:
    name: Planner DB Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d planner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client
          psql --version

      - name: Verify PowerShell
        run: pwsh -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Run real PostgreSQL Planner integration
        env:
          PGPASSWORD: postgres
          PLANNER_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/planner_test
        run: |
          echo "::add-mask::$PLANNER_DATABASE_URL"
          pwsh -NoLogo -NoProfile -NonInteractive -Command \
            '& ./scripts/planner-integration-check.ps1 -DatabaseUrl $env:PLANNER_DATABASE_URL'

  planner-static:
    name: Planner Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Strict typecheck
        run: npm run typecheck:strict

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
