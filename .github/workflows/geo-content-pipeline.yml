name: GEO Content Pipeline

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geo-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Generate student questions
        run: npm run geo:questions
      - name: Cluster questions
        run: npm run geo:cluster
      - name: Generate draft pages
        run: npm run geo:draft
      - name: Validate sources
        run: npm run geo:sources
      - name: Run quality checks
        run: npm run geo:quality
      - name: Generate metadata
        run: npm run geo:metadata
      - name: Commit and push live GEO updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geo content/geo src/app/guides src/app/sitemap.ts src/lib/geo-content.ts package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No GEO changes to publish"
            exit 0
          fi
          git commit -m "GEO auto-publish - $(date -u +'%Y-%m-%d %H:%M')"
          git push origin HEAD:main
