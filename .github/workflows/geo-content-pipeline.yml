name: GEO Content Pipeline

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Two runs pushing to main at once would race on the same files. Queue them
# instead of cancelling — a cancelled run loses that day's generated content.
concurrency:
  group: geo-publish
  cancel-in-progress: false

jobs:
  geo-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate student questions
        run: npm run geo:questions
      - name: Cluster questions
        run: npm run geo:cluster
      - name: Generate draft pages
        run: npm run geo:draft
      - name: Validate sources
        run: npm run geo:sources
      - name: Run quality checks
        run: npm run geo:quality
      - name: Generate article images
        run: npm run geo:images
      - name: Generate metadata
        run: npm run geo:metadata

      # This pipeline commits TypeScript (src/app/guides, src/app/news,
      # src/components/news, src/app/sitemap.ts, src/lib/geo-content.ts)
      # straight to main with no review. Gate the push on the same checks CI
      # runs on a PR, so a bad generator cannot break the deployed site.
      - name: Verify generated output
        run: |
          npm run typecheck
          npm run lint
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

      - name: Commit and push live GEO updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geo content/geo public/generated/news src/app/guides src/app/news src/components/news src/app/sitemap.ts src/lib/geo-content.ts package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No GEO changes to publish"
            exit 0
          fi
          git commit -m "GEO auto-publish - $(date -u +'%Y-%m-%d %H:%M')"
          git push origin HEAD:main
