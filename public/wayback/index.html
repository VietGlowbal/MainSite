<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glowbal — Design Time Machine</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --chrome-1:#0a0d1a; --chrome-2:#111634; --edge:#242a4d;
    --ink:#eef0fb; --muted:#9aa0c4; --faint:#6b7099;
    --pink:#ff2d84; --cyan:#2ea6ff; --violet:#8a63ff;
    --grad:linear-gradient(90deg,#ff2d84 0%,#8a63ff 52%,#2ea6ff 100%);
    --header-h:112px;
  }
  html,body{height:100%}
  body{
    background:var(--chrome-1); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }

  /* ===== Chrome / bezel ===== */
  header{
    position:fixed; inset:0 0 auto 0; height:var(--header-h); z-index:5;
    background:linear-gradient(180deg,var(--chrome-2),var(--chrome-1));
    border-bottom:1px solid var(--edge);
    display:flex; flex-direction:column; gap:0;
    box-shadow:0 10px 30px -18px rgba(0,0,0,.8);
  }
  .bar{
    display:flex; align-items:center; gap:14px;
    padding:12px 18px 10px; min-height:56px;
  }
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:-.01em; font-size:15px; white-space:nowrap;}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--grad);box-shadow:0 0 12px 1px rgba(255,45,132,.5);}
  .brand .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand small{color:var(--faint);font-weight:600;margin-left:2px;}

  .addr{
    flex:1; min-width:0; display:flex; align-items:center; gap:10px;
    background:#070912; border:1px solid var(--edge); border-radius:999px;
    padding:8px 14px; color:var(--muted); font-size:13px; overflow:hidden;
  }
  .addr .clock{color:var(--cyan);flex:none;}
  .addr .date{color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; flex:none;}
  .addr .sep{color:var(--faint);flex:none}
  .addr .name{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .addr .host{margin-left:auto; color:var(--faint); font-size:11.5px; white-space:nowrap; flex:none; display:none;}
  @media(min-width:860px){.addr .host{display:block}}

  .open{
    flex:none; text-decoration:none; color:var(--ink); font-size:12.5px; font-weight:700;
    border:1px solid var(--edge); border-radius:999px; padding:8px 13px; white-space:nowrap;
    background:#0c1022; transition:border-color .15s, transform .1s;
  }
  .open:hover{border-color:var(--pink);}
  .open:active{transform:translateY(1px);}

  /* ===== Scrubber timeline ===== */
  .track{
    position:relative; display:flex; align-items:stretch; gap:0;
    padding:0 14px 12px; overflow-x:auto; scrollbar-width:none;
  }
  .track::-webkit-scrollbar{display:none}
  .rail{
    position:absolute; left:34px; right:34px; top:16px; height:2px;
    background:var(--edge); border-radius:2px;
  }
  .railfill{
    position:absolute; left:34px; top:16px; height:2px; border-radius:2px;
    background:var(--grad); transition:width .35s ease;
  }
  .nav{
    flex:none; width:30px; align-self:flex-start; margin-top:4px;
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;
    padding:2px 0; border-radius:8px;
  }
  .nav:hover{color:var(--ink)}
  .nav:disabled{opacity:.3;cursor:default}
  .stops{position:relative; display:flex; flex:1; min-width:560px;}
  .stop{
    flex:1; background:none; border:none; cursor:pointer; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:7px; padding:4px 4px 2px;
    font-family:inherit;
  }
  .stop .pin{
    width:16px;height:16px;border-radius:50%; background:var(--chrome-1);
    border:2px solid var(--edge); transition:all .2s; position:relative; z-index:1;
  }
  .stop .d{font-size:11px; font-variant-numeric:tabular-nums; color:var(--faint); transition:color .2s;}
  .stop .n{font-size:11.5px; font-weight:600; color:var(--muted); transition:color .2s; text-align:center; line-height:1.2;}
  .stop:hover .pin{border-color:var(--muted);}
  .stop:hover .n{color:var(--ink);}
  .stop.active .pin{border-color:transparent; background:var(--grad); box-shadow:0 0 0 4px rgba(255,45,132,.18);}
  .stop.active .d{color:var(--cyan)}
  .stop.active .n{color:var(--ink); font-weight:800;}

  /* ===== Stage ===== */
  .stage{position:fixed; inset:var(--header-h) 0 0 0; background:#fff;}
  iframe{width:100%; height:100%; border:0; display:block; background:#fff;}
  .loading{
    position:absolute; inset:0 0 auto 0; height:3px; z-index:6; overflow:hidden; opacity:0;
    transition:opacity .2s;
  }
  .loading.on{opacity:1}
  .loading::before{
    content:""; position:absolute; inset:0; width:40%;
    background:var(--grad); border-radius:2px;
    animation:slide 1s ease-in-out infinite;
  }
  @keyframes slide{0%{left:-40%}100%{left:100%}}

  .hint{
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:6;
    background:rgba(10,13,26,.9); color:var(--muted); border:1px solid var(--edge);
    border-radius:999px; padding:7px 15px; font-size:12px; backdrop-filter:blur(6px);
    display:flex; gap:8px; align-items:center; pointer-events:none;
    transition:opacity .4s;
  }
  .hint b{color:var(--ink); font-weight:700}
  .hint kbd{background:#070912;border:1px solid var(--edge);border-radius:5px;padding:1px 6px;font-size:11px;font-family:inherit;color:var(--ink)}
  @media(prefers-reduced-motion:reduce){.loading::before{animation:none;width:100%}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="dot"></span><span class="g">Glowbal</span><small>Design Time Machine</small></div>
    <div class="addr">
      <span class="clock">◷</span>
      <span class="date" id="addrDate">25 Apr 2026</span>
      <span class="sep">·</span>
      <span class="name" id="addrName">Landing showcase</span>
      <span class="host" id="addrHost"></span>
    </div>
    <a class="open" id="openLive" href="#" target="_blank" rel="noopener">Open live ↗</a>
  </div>
  <div class="track">
    <button class="nav" id="prev" aria-label="Previous era">‹</button>
    <div class="stops" id="stops"></div>
    <button class="nav" id="next" aria-label="Next era">›</button>
    <div class="rail" aria-hidden="true"></div>
    <div class="railfill" id="railfill" aria-hidden="true"></div>
  </div>
</header>

<div class="stage">
  <div class="loading" id="loading"></div>
  <iframe id="frame" title="Selected design era" referrerpolicy="no-referrer"></iframe>
</div>

<div class="hint" id="hint">Use the timeline or <kbd>←</kbd> <kbd>→</kbd> to travel between designs</div>

<script>
const BASE = "https://main-site-git-{slug}-auerlians-projects.vercel.app";
const ERAS = [
  { slug:"design-era-1-landing-showcase", date:"25 Apr 2026", name:"Landing showcase",
    blurb:"Five identities picked live" },
  { slug:"design-era-2-full-user-flow",   date:"5 May 2026",  name:"Full user flow",
    blurb:"The dark direction becomes an app" },
  { slug:"design-era-3-mentorship-hub",   date:"22 May 2026", name:"Mentorship Hub", path:"/mentors",
    blurb:"The pill-nav era" },
  { slug:"design-era-4-visual-polish",    date:"25 May 2026", name:"Visual polish",
    blurb:"Depth & atmosphere" },
  { slug:"design-era-5-ai-course-apply",  date:"22 Jun 2026", name:"AI course & Apply",
    blurb:"The language flips to light" },
];

const urlFor = e => BASE.replace("{slug}", e.slug) + (e.path || "/");
const hostFor = e => BASE.replace("{slug}", e.slug).replace("https://","");

const frame   = document.getElementById("frame");
const loading = document.getElementById("loading");
const stopsEl = document.getElementById("stops");
const railfill= document.getElementById("railfill");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const openLive= document.getElementById("openLive");
const hint    = document.getElementById("hint");

let idx = 0;

// build stops
ERAS.forEach((e,i) => {
  const b = document.createElement("button");
  b.className = "stop";
  b.innerHTML = `<span class="pin"></span><span class="d">${e.date}</span><span class="n">${e.name}</span>`;
  b.addEventListener("click", () => go(i));
  stopsEl.appendChild(b);
});
const stopEls = [...stopsEl.children];

function go(i, replaceHash){
  i = Math.max(0, Math.min(ERAS.length-1, i));
  idx = i;
  const e = ERAS[i];
  loading.classList.add("on");
  frame.src = urlFor(e);
  document.getElementById("addrDate").textContent = e.date;
  document.getElementById("addrName").textContent = e.name + " — " + e.blurb;
  document.getElementById("addrHost").textContent = hostFor(e);
  openLive.href = urlFor(e);
  stopEls.forEach((s,j)=> s.classList.toggle("active", j===i));
  railfill.style.width = (ERAS.length===1?0:(i/(ERAS.length-1))) * 100 + "%";
  prevBtn.disabled = i===0;
  nextBtn.disabled = i===ERAS.length-1;
  if(!replaceHash) history.replaceState(null,"","#"+(i+1));
  stopEls[i].scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
}

frame.addEventListener("load", ()=> loading.classList.remove("on"));
prevBtn.addEventListener("click", ()=> go(idx-1));
nextBtn.addEventListener("click", ()=> go(idx+1));
addEventListener("keydown", ev=>{
  if(ev.key==="ArrowLeft") go(idx-1);
  else if(ev.key==="ArrowRight") go(idx+1);
});

// initial era from hash (#1..#5)
const start = Math.max(1, Math.min(ERAS.length, parseInt(location.hash.slice(1))||1)) - 1;
go(start, true);

// fade the hint after a bit
setTimeout(()=>{ hint.style.opacity = "0"; }, 6000);
</script>
</body>
</html>
